name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Context
        run: echo "Reviewing ${{ github.event.pull_request.title }} by ${{ github.actor }}"

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Python tests
        run: pytest -q

      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Node deps
        run: npm install

      - name: Node tests
        run: npm test

      - name: Notify
        run: |
          echo "deploy_key=${{ secrets.DEPLOY_KEY }}" >> notify.env
          cat notify.env
