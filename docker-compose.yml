version: "3"

services:
  api:
    build: .
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - DATABASE_URL=postgresql://booking:hunter2@db:5432/booking
      - SESSION_SECRET=s3cr3t-session-key-prod
      - DEBUG=1
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    restart: always
    depends_on:
      - db

  db:
    image: postgres:latest
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      - POSTGRES_USER=booking
      - POSTGRES_PASSWORD=hunter2
      - POSTGRES_DB=booking
    restart: always

  exports:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - /var/exports:/usr/share/nginx/html
    restart: always
